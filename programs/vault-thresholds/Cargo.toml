[package]
name = "vault-thresholds"
version = "0.2.0"
description = "On-chain parametric risk-threshold storage with permissioned oracle updates."
edition = "2021"
license = "MIT"
authors = ["Max Gorbuk <103102868+mkzung@users.noreply.github.com>"]
repository = "https://github.com/mkzung/solana-vault-thresholds"
readme = "../../README.md"
keywords = ["solana", "anchor", "defi", "risk", "oracle"]
categories = ["cryptography::cryptocurrencies", "finance"]

[lib]
crate-type = ["cdylib", "lib"]
name = "vault_thresholds"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
# Anchor's `#[derive(Accounts)]` macro emits `#[cfg(feature = "anchor-debug")]`
# guards. Without declaring the feature here, modern rustc (≥1.80) flags it as
# `unexpected_cfgs` and clippy promotes that to an error in CI.
anchor-debug = []

[dependencies]
# `init-if-needed` intentionally NOT enabled — it ships an Anchor attribute
# that re-initializes accounts under footgunny conditions. We use plain
# `init` and don't need the gated attribute.
anchor-lang = "0.30.1"
