[package]
name = "vault-thresholds"
version = "0.1.0"
description = "On-chain parametric risk-threshold storage with permissioned oracle updates."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "vault_thresholds"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
# Anchor's `#[derive(Accounts)]` macro emits `#[cfg(feature = "anchor-debug")]`
# guards. Without declaring the feature here, modern rustc (≥1.80) flags it as
# `unexpected_cfgs` and clippy promotes that to an error in CI.
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
