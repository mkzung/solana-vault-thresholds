name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI design note (Round 3, post-mortem):
#
# We previously had a second job (`anchor-build-and-test`) that ran
# `anchor build` + `anchor test` against a local validator. We removed
# it because Anchor 0.30.1 + Solana 1.18.20's bundled toolchain
# (cargo ≈1.75) conflicts with modern AVM (which now requires Rust 1.85+
# for the `edition2024` feature). Specifically:
#   - AVM install requires rustc ≥1.85
#   - rustc ≥1.84 defaults Cargo.lock to lockfile-version 4
#   - cargo-build-sbf (Solana 1.18.20) only parses v3
# Threading this needle (two-toolchain dance, vendored anchor, etc.) added
# fragile machinery for marginal signal: the in-crate `cargo clippy --features
# no-entrypoint` already exercises Anchor's `#[derive(Accounts)]`, `#[program]`,
# and `#[account]` macros, so a compile-time regression in the program logic
# is caught by the unit-tests job. The BPF target build is verified locally
# (see README) before each release.

jobs:
  rust-unit-tests:
    name: Rust unit tests (anchor macro expansion + lib tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # `no-entrypoint` removes the BPF program entrypoint so the crate builds
        # on a vanilla host target. This still exercises all of Anchor's
        # derive macros (Accounts, account, program, error) and catches any
        # compile-time regression in the on-chain logic.
        run: cargo clippy --all-targets --features no-entrypoint -- -D warnings
      - name: cargo test (in-crate unit tests)
        run: cargo test --lib --features no-entrypoint
