name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI design note (v0.2.0):
#
# Two jobs run on every push/PR:
#   1. rust-unit-tests — fmt + clippy + in-crate `#[cfg(test)]` tests using
#      a stable host rustc and the `no-entrypoint` feature. Catches macro
#      regressions and program-logic regressions without the BPF target.
#   2. anchor-build    — full Anchor 0.30.1 BPF compile via the bootstrap
#      flow documented in the README (solana-keygen → anchor keys sync →
#      anchor build). Gates releases on packaging success.
#
# `anchor test` (the validator-spinning integration suite at
# tests/vault-thresholds.ts) still runs locally before each tag; the local
# validator under GitHub Actions has historically been flaky around startup
# timing and we prefer a deterministic release gate over a noisy CI signal.

jobs:
  rust-unit-tests:
    name: Rust unit tests (anchor macro expansion + lib tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # `no-entrypoint` removes the BPF program entrypoint so the crate builds
        # on a vanilla host target. This still exercises all of Anchor's
        # derive macros (Accounts, account, program, error) and catches any
        # compile-time regression in the on-chain logic.
        run: cargo clippy --all-targets --features no-entrypoint -- -D warnings
      - name: cargo test (in-crate unit tests)
        run: cargo test --lib --features no-entrypoint

  anchor-build:
    name: Anchor BPF build (full lifecycle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana CLI 1.18.20
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.20/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Verify Solana toolchain
        run: solana --version
      - name: Install Anchor CLI 0.30.1 via avm
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.30.1
          avm use 0.30.1
          anchor --version
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: yarn install
        run: yarn install --frozen-lockfile || yarn install
      - name: Bootstrap program keypair + sync ID
        run: |
          mkdir -p target/deploy
          solana-keygen new \
            -o target/deploy/vault_thresholds-keypair.json \
            --no-bip39-passphrase --silent --force
          anchor keys sync
      - name: anchor build
        run: anchor build
