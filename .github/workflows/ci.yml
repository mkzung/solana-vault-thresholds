name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-unit-tests:
    name: Rust unit tests (no Solana toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # `no-entrypoint` removes the BPF program entrypoint so the crate builds
        # on a vanilla host target; the in-crate `#[cfg(test)] mod tests` is
        # then runnable without solana-runtime.
        run: cargo clippy --all-targets --features no-entrypoint -- -D warnings
      - name: cargo test (in-crate unit tests)
        run: cargo test --lib --features no-entrypoint

  anchor-build-and-test:
    name: Anchor build + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.20/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.30.1
          avm use 0.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: yarn install
        run: |
          npm install --global yarn
          yarn install --frozen-lockfile
      - name: anchor build
        run: anchor build
      - name: anchor test (local validator)
        run: anchor test --skip-deploy
