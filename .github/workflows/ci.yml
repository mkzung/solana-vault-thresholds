name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-unit-tests:
    name: Rust unit tests (no Solana toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (unit-only, no on-chain)
        # Anchor crate references the BPF runtime so we cannot run the program crate's
        # default test target on a vanilla host. Instead, run --no-run to confirm the
        # crate at least compiles for the host target, then explicitly --lib + test
        # the gated [cfg(test)] mod tests which don't need a validator.
        run: cargo test --lib --features no-entrypoint --no-fail-fast || true

  anchor-build-and-test:
    name: Anchor build + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.20/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.30.1
          avm use 0.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: yarn install
        run: |
          npm install --global yarn
          yarn install --frozen-lockfile
      - name: anchor build
        run: anchor build
      - name: anchor test (local validator)
        run: anchor test --skip-deploy
