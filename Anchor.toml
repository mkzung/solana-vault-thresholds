[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.20"

[features]
resolution = true
skip-lint = false

# PLACEHOLDER program ID — run `anchor keys sync` after first build to
# replace with a key whose private half lives in
# target/deploy/vault_thresholds-keypair.json. Do NOT deploy with this.
[programs.localnet]
vault_thresholds = "VtThr11111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
